<title>Watch Deal Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #edf0ee; --surface: #ffffff; --ink: #17201b; --muted: #5b6861; --line: #d6ddd8;
    --accent: #2d5b7a; --accent-ink: #ffffff; --chip: #e4e9e6;
    --hot: #c4480f; --good: #2a7a4b; --bad: #b3261e;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f1311; --surface: #171c19; --ink: #e6ece8; --muted: #97a39c; --line: #2a322d;
      --accent: #7fb2d6; --accent-ink: #0f1311; --chip: #222924;
      --hot: #f08a4b; --good: #6bcb8f; --bad: #f28b82;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f1311; --surface: #171c19; --ink: #e6ece8; --muted: #97a39c; --line: #2a322d;
    --accent: #7fb2d6; --accent-ink: #0f1311; --chip: #222924;
    --hot: #f08a4b; --good: #6bcb8f; --bad: #f28b82;
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.45 var(--sans); }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
  header { display: grid; gap: 12px; margin-bottom: 16px; }
  .titlebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .status { font: 12.5px/1.4 var(--mono); color: var(--muted); }
  .status b { color: var(--ink); font-weight: 600; }
  .status .warn { color: var(--bad); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { font: 500 13px var(--sans); padding: 6px 12px; border-radius: 999px; cursor: pointer;
                  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .quick button .n { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); margin-left: 4px; }
  .quick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  .quick button[aria-pressed="true"] .n { color: inherit; opacity: .75; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .filters label { display: grid; gap: 3px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  select, input { font: 14px var(--sans); padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--surface); color: var(--ink); width: 100%; }
  select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refline { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  .refline a { color: var(--accent); text-underline-offset: 2px; }
  .notice { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; color: var(--muted); }
  .grid > .notice { grid-column: 1 / -1; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 14px; align-items: stretch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  .card.hot { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
  .card.dim { opacity: .62; }
  .photo { position: relative; display: block; aspect-ratio: 4 / 3; background: var(--chip); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dial { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px;
          color: var(--muted); font-size: 12px; }
  .dial i { width: 56px; height: 56px; border: 2px solid currentColor; border-radius: 50%; position: relative; opacity: .55; }
  .dial i::before, .dial i::after { content: ""; position: absolute; left: 50%; bottom: 50%; width: 2px; background: currentColor;
          transform-origin: bottom center; border-radius: 1px; }
  .dial i::before { height: 18px; transform: translateX(-50%) rotate(-60deg); }
  .dial i::after { height: 24px; transform: translateX(-50%) rotate(50deg); }
  .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font: 600 11.5px var(--sans); letter-spacing: .02em; padding: 2px 8px; border-radius: 999px;
           background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
  .badge.hot { background: var(--hot); color: #fff; }
  .badge.new { background: var(--accent); color: var(--accent-ink); }
  .badge.gone { background: var(--bad); color: #fff; }
  .deal { position: absolute; left: 8px; bottom: 8px; font: 600 13px var(--mono); padding: 3px 9px; border-radius: 7px;
          background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .22); }
  .deal.pos { color: var(--good); } .deal.neg { color: var(--bad); }
  .body { padding: 11px 13px 4px; display: grid; gap: 7px; align-content: start; min-width: 0; }
  .title { font-weight: 600; font-size: 15px; line-height: 1.3; color: var(--ink); text-decoration: none; overflow-wrap: anywhere;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .title:hover { text-decoration: underline; }
  .desc { font-size: 13px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; margin: 0; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pricebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .price { font: 600 18px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .down { color: var(--good); } .up { color: var(--bad); }
  .ref { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .ref b { color: var(--ink); font: 600 12.5px var(--mono); }
  .ref a { color: var(--accent); text-underline-offset: 2px; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; }
  .meta .tag { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 0 7px; }
  .linkish { font: 12.5px var(--sans); background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer;
             text-decoration: underline; text-underline-offset: 2px; }
  .comps-list { margin: 0; padding-left: 16px; font-size: 12px; display: grid; gap: 2px; }
  .comps-list a { color: var(--ink); }
  .comps-list .num { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  .refform { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .refform .line { display: flex; gap: 4px; align-items: center; }
  .refform input { width: 76px; padding: 5px 6px; font: 13px var(--mono); }
  .refform button { font: 500 12px var(--sans); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line);
                    background: var(--surface); color: var(--ink); cursor: pointer; }
  .refform button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: 8px; }
  .actions button { font: 500 13px var(--sans); padding: 10px 4px; cursor: pointer; border: 0; background: none;
                    color: var(--muted); white-space: nowrap; }
  .actions button + button { border-left: 1px solid var(--line); }
  .actions button:hover { color: var(--ink); background: var(--chip); }
  .actions button.on { background: var(--accent); color: var(--accent-ink); }
  .actions button:disabled { cursor: default; opacity: .6; }
  .more { display: flex; justify-content: center; margin-top: 18px; }
  .more button { font: 500 14px var(--sans); padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--surface); color: var(--ink); cursor: pointer; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .card { grid-template-columns: 116px minmax(0, 1fr); grid-template-rows: auto auto; }
    .photo { aspect-ratio: auto; min-height: 116px; height: 100%; }
    .badges { top: 6px; left: 6px; right: 6px; }
    .badge { font-size: 10.5px; padding: 1px 6px; }
    .deal { left: 6px; bottom: 6px; font-size: 12px; padding: 2px 6px; }
    .body { padding: 9px 11px 6px; gap: 5px; }
    .title { font-size: 14px; }
    .price { font-size: 16px; }
    .actions { grid-column: 1 / -1; margin-top: 0; }
  }
  @media (prefers-reduced-motion: no-preference) { .actions button, .quick button { transition: background .15s, color .15s; } }
</style>

<div class="wrap">
  <header>
    <div class="titlebar">
      <h1>Watch Deal Board</h1>
      <div class="status" id="status">Connecting to the deal database…</div>
    </div>
    <div class="quick" id="quick" role="group" aria-label="Quick filters">
      <button type="button" data-quick="" aria-pressed="true">All<span class="n" id="n-all"></span></button>
      <button type="button" data-quick="hot" aria-pressed="false">🔥 Hot deals<span class="n" id="n-hot"></span></button>
      <button type="button" data-quick="new" aria-pressed="false">New today<span class="n" id="n-new"></span></button>
      <button type="button" data-quick="below" aria-pressed="false">Below typical<span class="n" id="n-below"></span></button>
    </div>
    <div class="filters">
      <label for="f-search">Search<select id="f-search"><option value="">All searches</option></select></label>
      <label for="f-source">Source<select id="f-source">
        <option value="">All sources</option><option value="jofogas">Jófogás</option><option value="ebay">eBay</option>
      </select></label>
      <label for="f-max">Max price (Ft)<input id="f-max" inputmode="numeric" placeholder="any"></label>
      <label for="f-sort">Sort<select id="f-sort">
        <option value="newest">Newest</option><option value="cheapest">Cheapest</option><option value="margin">Best deal</option>
      </select></label>
      <label for="f-view">Show<select id="f-view">
        <option value="active">Active candidates</option><option value="interested">Interested</option>
        <option value="bought">Bought</option><option value="ignore">Ignored</option><option value="gone">Gone</option>
      </select></label>
    </div>
    <div class="refline" id="refline"></div>
  </header>
  <main class="grid" id="list"><div class="notice">Loading listings…</div></main>
  <div class="more" id="more" hidden><button type="button" id="more-btn">Show more</button></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SOURCE_LABELS = { jofogas: "Jófogás", ebay: "eBay" };
const huf = (n) => n == null ? "–" : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { active: [], gone: [], meta: null, db: null, loaded: false, readOnly: false, busy: new Set(),
                refs: {},          // watch (its eBay search words) -> {eur, id}: your refs from eBay sold prices
                byId: {},          // every listing by id, to show a reference's comparable ads
                openComps: null,   // id of the row whose comparable ads are expanded
                editing: null,     // {id, key} of the row whose reference editor is open
                draft: "",
                thumbs: {},        // listing id -> small photo (data: URI) from the hourly run
                openDesc: new Set(),
                quick: "",         // "", "hot", "new" or "below"
                limit: 60 };       // cards rendered; "Show more" adds another page
const PAGE = 60;
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
const refDocId = (key) => key.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 200);

function ago(iso) {
  if (!iso) return "";
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + " min ago";
  if (mins < 48 * 60) return Math.round(mins / 60) + " h ago";
  return Math.round(mins / 1440) + " days ago";
}
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

function decorate(doc, selectedSearch) {
  const meta = state.meta || {};
  const rate = meta.eur_huf_rate || 395, ratio = meta.hot_deal_ratio || 0.5;
  const searchRefs = (meta.searches || [])
    .filter((s) => (doc.searches || []).includes(s.name) && s.reference_price_eur && (!selectedSearch || s.name === selectedSearch))
    .map((s) => s.reference_price_eur);
  // Same order as market.py: your ref for this watch, then the median of its comparable
  // ads (worked out by the hourly run and stored on the listing), then the search's ref.
  const key = doc.comps_query || "";
  const rules = meta.market_rules || { min_comps_hot: 5, max_spread: 0.7 };
  let ref = null, refFrom = null, refKey = null, stats = null;
  if (key && state.refs[key]) { ref = state.refs[key].eur; refFrom = "you"; refKey = key; }
  else if (doc.market) { ref = doc.market.median / rate; refFrom = "market"; refKey = doc.market.basis; stats = doc.market; }
  else if (searchRefs.length) { ref = Math.max(...searchRefs); refFrom = "search"; }
  const spreadOk = refFrom !== "market" || ((stats.p75 - stats.p25) / stats.median <= rules.max_spread
    && stats.n >= rules.min_comps_hot);
  const eur = doc.price_huf == null ? null : doc.price_huf / rate;
  const margin = ref != null && eur != null ? ref - eur : null;
  const points = [];
  for (const h of doc.history || []) if (!points.length || points[points.length - 1] !== h.huf) points.push(h.huf);
  return { ...doc, key, ref, refFrom, refKey, stats, eur, margin, marginPct: margin == null ? null : Math.round(100 * margin / ref),
           hot: ref != null && spreadOk && !doc.parts && doc.price_huf != null && doc.price_huf >= 1000
                && doc.price_huf <= ref * rate * ratio, points };
}

// eBay "sold items" search: what this model actually sold for. Opens in the browser.
function soldUrl(query) {
  const m = state.meta || {};
  const cat = String(m.ebay_category || "31387").split(",")[0];
  return `https://www.${m.ebay_sold_domain || "ebay.de"}/sch/i.html?_nkw=${encodeURIComponent(query).replace(/%20/g, "+")}`
    + `&LH_Sold=1&LH_Complete=1` + (cat ? `&_sacat=${encodeURIComponent(cat)}` : "");
}

function historyText(points) {
  if (points.length < 2) return "";
  const shown = points.slice(-4);
  return (points.length > 4 ? "… " : "") + shown.map((p, i) =>
    (i ? ` <span class="${p < shown[i - 1] ? "down" : "up"}">→</span> ` : "") + huf(p).replace(" Ft", "")).join("") + " Ft";
}

function visible() {
  const view = $("f-view").value, search = $("f-search").value, source = $("f-source").value;
  const max = parseInt($("f-max").value.replace(/\D/g, ""), 10);
  let base;
  if (view === "active") base = state.active.filter((d) => d.user_status !== "ignore");
  else if (view === "gone") base = state.gone;
  else base = [...state.active, ...state.gone].filter((d) => d.user_status === view);
  let items = base
    .filter((d) => !search || (d.searches || []).includes(search))
    .filter((d) => !source || d.source === source)
    .filter((d) => isNaN(max) || (d.price_huf != null && d.price_huf <= max))
    .map((d) => decorate(d, search));
  state.counts = { all: items.length, hot: items.filter((d) => d.hot).length,
                   new: items.filter(isNew).length, below: items.filter(isBelow).length };
  if (state.quick === "hot") items = items.filter((d) => d.hot);
  else if (state.quick === "new") items = items.filter(isNew);
  else if (state.quick === "below") items = items.filter(isBelow);
  const sort = $("f-sort").value;
  if (sort === "newest") items.sort((a, b) => String(b.first_seen).localeCompare(String(a.first_seen)));
  else if (sort === "cheapest") items.sort((a, b) => (a.price_huf ?? Infinity) - (b.price_huf ?? Infinity));
  else {
    // Best deal: cheapest relative to the reference (price ÷ reference), unreferenced last.
    const ratio = (x) => (x.ref && x.price_huf) ? x.price_huf / (x.ref * ((state.meta && state.meta.eur_huf_rate) || 395)) : Infinity;
    items.sort((a, b) => ratio(a) - ratio(b));
  }
  return items;
}

const isNew = (d) => d.first_seen && Date.now() - new Date(d.first_seen).getTime() < 864e5;
const isBelow = (d) => d.ref != null && d.eur != null && d.eur < d.ref;

function compsList(it) {
  const rows = (it.stats.comps || []).map((id) => state.byId[id]).filter(Boolean).map((c) =>
    `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="num">${huf(c.price_huf)}</span>${c.status === "gone" ? " <em>(gone)</em>" : ""}</li>`);
  const more = (it.stats.n > rows.length) ? `<li class="sub">+ ${it.stats.n - rows.length} more</li>` : "";
  return `<ul class="comps-list">${rows.join("")}${more}</ul>`;
}

function refEditor(it) {
  if (!it.key || state.readOnly) return "";
  const own = state.refs[it.key];
  const open = state.editing && state.editing.id === it._id;
  if (!open) {
    return `<button type="button" class="linkish" data-setref="${esc(it.key)}">${own ? "edit ref" : "set ref"}</button>`;
  }
  const count = state.active.filter((d) => d.comps_query === it.key).length;
  return `<form class="refform" data-model="${esc(it.key)}">
    <span>Resale ref for “${esc(it.key)}” (${count} listing${count === 1 ? "" : "s"})</span>
    <span class="line"><input id="ref-input" inputmode="decimal" autocomplete="off" value="${esc(state.draft)}"
      aria-label="Resale reference in euros"> €
      <button type="submit">Save</button>
      ${own ? `<button type="button" data-clearref>Clear</button>` : ""}
      <button type="button" data-cancelref aria-label="Cancel">✕</button></span>
  </form>`;
}

function photoHtml(it) {
  const img = state.thumbs[it._id];
  if (img) return `<img src="${esc(img)}" alt="" loading="lazy">`;
  return `<span class="dial" aria-hidden="true"><i></i>${it.thumbnail_url ? "No photo yet" : "No photo"}</span>`;
}

function cardHtml(it) {
  const price = it.currency === "HUF" ? huf(it.price_huf) : it.price == null ? "–" : `${Number(it.price).toFixed(2)} ${esc(it.currency)}`;
  const priceSub = it.currency === "HUF" ? (it.eur == null ? "" : `~${Math.round(it.eur)} €`) : huf(it.price_huf);
  const pct = Math.round(100 * ((state.meta && state.meta.hot_deal_ratio) || 0.5));

  // How far the price is from the reference: the pill on the photo.
  let deal = "", refHtml;
  if (it.margin == null) {
    refHtml = `<span>No reference yet: too few similar ads</span>`;
  } else if (it.refFrom === "market") {
    // Median asking price of this watch's most similar Jófogás ads.
    const st = it.stats, below = Math.round(100 * (st.median - it.price_huf) / st.median);
    deal = below >= 0 ? `<span class="deal pos">${below}% below</span>` : `<span class="deal neg">${-below}% above</span>`;
    const open = state.openComps === it._id;
    refHtml = `<span title="Middle half ${huf(st.p25)}–${huf(st.p75)}">typical <b>${huf(st.median)}</b></span>
      <button type="button" class="linkish" data-comps="${esc(it._id)}" aria-expanded="${open}">vs ${st.n} ${st.generic ? "similar vague" : "similar"} ads ${open ? "▴" : "▾"}</button>`;
  } else {
    const sign = it.margin < 0 ? "−" : "+";
    deal = `<span class="deal ${it.margin >= 0 ? "pos" : "neg"}">${sign}${Math.abs(Math.round(it.margin))} €</span>`;
    refHtml = `<span>${it.refFrom === "you" ? "your" : "search"} ref <b>${Math.round(it.ref)} €</b> · ${sign}${Math.abs(it.marginPct)}%</span>`;
  }
  if (it.comps_query) {
    refHtml += `<a href="${esc(soldUrl(it.comps_query))}" target="_blank" rel="noopener"
      title="eBay sold items: ${esc(it.comps_query)}">eBay sold ↗</a>`;
  }
  const editor = refEditor(it);
  if (editor && !(state.editing && state.editing.id === it._id)) refHtml += editor;

  const badges = (it.hot ? `<span class="badge hot">🔥 ≤ ${pct}% of ${it.refFrom === "market" ? "typical" : "ref"}</span>` : "")
    + (isNew(it) && it.status !== "gone" ? `<span class="badge new">New</span>` : "")
    + (it.status === "gone" ? `<span class="badge gone">Gone ${esc(ago(it.gone_at))}</span>` : "")
    + (it.parts ? `<span class="badge">🔧 Parts / defect</span>` : "");

  let desc = "";
  if (it.summary) {
    const open = state.openDesc.has(it._id), long = it.summary.length > 110;
    desc = `<p class="desc ${open ? "" : "clamp"}">${esc(it.summary)}</p>`
      + (long ? `<button type="button" class="linkish" data-desc="${esc(it._id)}">${open ? "Less" : "More"}</button>` : "");
  }
  const tags = [esc(it.location || ""), esc(ago(it.first_seen)), SOURCE_LABELS[it.source] || esc(it.source)]
    .filter(Boolean).map((t) => `<span>${t}</span>`).join("<span>·</span>")
    + (it.searches || []).map((x) => `<span class="tag">${esc(x)}</span>`).join("");
  const hist = historyText(it.points);
  const buttons = [["interested", "★ Interested"], ["bought", "✓ Bought"], ["ignore", "✕ Ignore"]].map(([st, label]) =>
    `<button type="button" data-status="${st}" class="${it.user_status === st ? "on" : ""}" aria-pressed="${it.user_status === st}"
       ${state.readOnly || state.busy.has(it._id) ? "disabled" : ""}>${label}</button>`).join("");

  return `<article class="card ${it.hot ? "hot" : ""} ${it.user_status === "ignore" || it.status === "gone" ? "dim" : ""}"
    data-id="${esc(it._id)}" data-shard="${esc(it._shard)}">
    <a class="photo" href="${esc(it.url)}" target="_blank" rel="noopener" aria-label="Open the ad">
      ${photoHtml(it)}<span class="badges">${badges}</span>${deal}</a>
    <div class="body">
      <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="pricebar"><span class="price">${price}</span><span class="sub">${priceSub}</span>
        ${hist ? `<span class="sub">${hist}</span>` : ""}</div>
      ${desc ? `<div>${desc}</div>` : ""}
      <div class="ref">${refHtml}</div>
      ${state.openComps === it._id && it.stats ? compsList(it) : ""}
      ${state.editing && state.editing.id === it._id ? editor : ""}
      <div class="meta">${tags}</div>
    </div>
    <div class="actions">${buttons}</div>
  </article>`;
}

function render() {
  const items = visible();
  if (!state.db || !state.loaded) return;
  if (!state.active.length && !state.gone.length) {
    $("list").innerHTML = `<div class="notice">No listings yet. They appear after the first hourly check has run.</div>`;
  } else if (!items.length) {
    $("list").innerHTML = `<div class="notice">Nothing matches these filters.</div>`;
  } else {
    $("list").innerHTML = items.slice(0, state.limit).map(cardHtml).join("");
  }
  $("more").hidden = items.length <= state.limit;
  $("more-btn").textContent = `Show more (${items.length - state.limit} left)`;
  renderQuick();
  renderStatus(items.length);
  renderRefline();
  const input = $("ref-input");
  if (input && document.activeElement !== input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function renderQuick() {
  const c = state.counts || {};
  for (const k of ["all", "hot", "new", "below"]) $("n-" + k).textContent = c[k] == null ? "" : c[k];
  for (const b of document.querySelectorAll("#quick button")) b.setAttribute("aria-pressed", String(b.dataset.quick === state.quick));
}

function renderStatus(shown) {
  const m = state.meta;
  if (!m) { $("status").textContent = `${state.active.length} active listings`; return; }
  const s = m.summary || {};
  const fails = (s.failures || []).length;
  $("status").innerHTML = `last check <b>${esc(clock(m.last_run))}</b> (${esc(ago(m.last_run))}) · `
    + `<b>${state.active.length}</b> active · ${shown} shown`
    + (fails ? ` · <span class="warn">${fails} search${fails > 1 ? "es" : ""} failed</span>` : "");
}

function renderRefline() {
  const name = $("f-search").value;
  const info = ((state.meta && state.meta.searches) || []).find((s) => s.name === name);
  if (!info) { $("refline").textContent = ""; return; }
  const parts = [];
  if (info.max_price_huf) parts.push(esc(`alerts up to ${huf(info.max_price_huf)}`));
  if (info.reference_price_eur) parts.push(esc(`resale reference ${info.reference_price_eur} €`));
  const kw = (info.keywords && info.keywords[0]) || name;
  parts.push(`<a href="${esc(soldUrl(kw))}" target="_blank" rel="noopener">check eBay sold prices ↗</a>`);
  // Ads that disappeared in the last 30 days: sold or withdrawn, at their last asking price.
  const monthAgo = new Date(Date.now() - 30 * 864e5).toISOString();
  const gone = state.gone.filter((d) => d.source === "jofogas" && (d.searches || []).includes(name)
    && d.price_huf && (d.gone_at || "") >= monthAgo).map((d) => d.price_huf);
  if (gone.length) parts.push(esc(`Jófogás: ${gone.length} gone in 30 days, median last price ${huf(median(gone))}`));
  const rate = state.meta.eur_huf_rate || 395;
  const ebay = state.active.filter((d) => d.source === "ebay" && (d.searches || []).includes(name) && d.price_huf)
    .map((d) => d.price_huf / rate);
  if (ebay.length) parts.push(esc(`eBay active median ${Math.round(median(ebay))} € (${ebay.length})`));
  $("refline").innerHTML = parts.join(" · ");
}

function fillSearchOptions() {
  const sel = $("f-search"), current = sel.value;
  const names = ((state.meta && state.meta.searches) || []).map((s) => s.name);
  sel.innerHTML = `<option value="">All searches</option>` + names.map((n) => `<option>${esc(n)}</option>`).join("");
  if (names.includes(current)) sel.value = current;
}

$("list").addEventListener("click", async (ev) => {
  const setBtn = ev.target.closest("button[data-setref]");
  if (setBtn) {
    const key = setBtn.dataset.setref;
    state.editing = { id: setBtn.closest(".card").dataset.id, key };
    state.draft = state.refs[key] ? String(state.refs[key].eur) : "";
    render();
    return;
  }
  if (ev.target.closest("button[data-cancelref]")) { state.editing = null; render(); return; }
  const descBtn = ev.target.closest("button[data-desc]");
  if (descBtn) {
    const id = descBtn.dataset.desc;
    state.openDesc.has(id) ? state.openDesc.delete(id) : state.openDesc.add(id);
    render();
    return;
  }
  const compsBtn = ev.target.closest("button[data-comps]");
  if (compsBtn) { state.openComps = state.openComps === compsBtn.dataset.comps ? null : compsBtn.dataset.comps; render(); return; }
  if (ev.target.closest("button[data-clearref]")) {
    const key = state.editing && state.editing.key;
    state.editing = null;
    if (key && state.refs[key]) await saveRef(key, null);
    return;
  }
  const btn = ev.target.closest("button[data-status]");
  if (!btn || !state.db || state.readOnly) return;
  const row = btn.closest(".card"), id = row.dataset.id;
  const status = btn.classList.contains("on") ? null : btn.dataset.status;  // click again to clear
  state.busy.add(id); render();
  try {
    // Nested objects merge, so this touches only this listing's user_status.
    await state.db.doc("shards/" + row.dataset.shard).update({ items: { [id]: { user_status: status } } });
  } catch (e) {
    if (e && e.code === "invalid_argument") state.readOnly = true;
    $("status").textContent = "Couldn't save that change. Try again in a moment.";
  } finally {
    state.busy.delete(id); render();
  }
});

$("list").addEventListener("input", (ev) => { if (ev.target.id === "ref-input") state.draft = ev.target.value; });
$("list").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target.closest(".refform");
  if (!form) return;
  const eur = parseFloat(String(state.draft).replace(/\s/g, "").replace(",", "."));
  if (!(eur > 0)) { $("ref-input").setCustomValidity("Enter a price in euros, e.g. 85"); $("ref-input").reportValidity(); return; }
  state.editing = null;
  await saveRef(form.dataset.model, Math.round(eur * 100) / 100);
});

async function saveRef(key, eur) {
  try {
    const ref = state.db.doc("refs/" + refDocId(key));
    if (eur == null) await ref.delete();
    else await ref.set({ model: key, eur, set_at: new Date().toISOString() });
  } catch (e) {
    if (e && e.code === "invalid_argument") state.readOnly = true;
    $("status").textContent = "Couldn't save the reference. Try again in a moment.";
  }
  render();
}

const refilter = () => { state.limit = PAGE; savePrefs(); render(); };
["f-search", "f-source", "f-sort", "f-view"].forEach((id) => $(id).addEventListener("change", refilter));
$("f-max").addEventListener("input", refilter);
$("quick").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-quick]");
  if (!b) return;
  state.quick = b.dataset.quick;
  refilter();
});
$("more-btn").addEventListener("click", () => { state.limit += PAGE; render(); });

function savePrefs() {
  try {
    localStorage.setItem("wdb-filters", JSON.stringify(Object.fromEntries(
      [...["f-search", "f-source", "f-max", "f-sort", "f-view"].map((id) => [id, $(id).value]), ["quick", state.quick]])));
  } catch (e) {}
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem("wdb-filters") || "{}");
    for (const [id, v] of Object.entries(p)) if ($(id) && id !== "f-search") $(id).value = v;
    if (["", "hot", "new", "below"].includes(p.quick)) state.quick = p.quick;
    return p["f-search"] || "";
  } catch (e) { return ""; }
}

const wantedSearch = loadPrefs();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) {
    $("status").textContent = "Deal database unavailable";
    $("list").innerHTML = `<div class="notice">Open this page on claude.ai (signed in) to see the listings.</div>`;
    return;
  }
  state.db = db;
  const onErr = (e) => {
    $("list").innerHTML = `<div class="notice">Lost the connection to the deal database (${esc(e && e.code)}). Reload the page.</div>`;
  };
  db.doc("meta/status").onSnapshot((snap) => {
    state.meta = snap.exists ? snap.data() : null;
    fillSearchOptions();
    if (wantedSearch && !$("f-search").value) $("f-search").value = wantedSearch;
    render();
  }, onErr);
  // Per-model resale references, set above from eBay sold prices; the hourly run uses them too.
  db.collection("refs").limit(1000).onSnapshot((snap) => {
    const refs = {};
    for (const d of snap.docs) {
      const r = d.data() || {};
      if (r.model && r.eur > 0) refs[r.model] = { eur: r.eur, id: d.id };
    }
    state.refs = refs;
    render();
  }, onErr);
  // Small listing photos, stored by the hourly run (the page can't load them from Jófogás directly).
  db.collection("thumbs").limit(100).onSnapshot((snap) => {
    const thumbs = {};
    for (const d of snap.docs) {
      for (const [id, t] of Object.entries((d.data() || {}).items || {})) {
        if (t && typeof t.img === "string" && t.img.startsWith("data:image/")) thumbs[id] = t.img;
      }
    }
    state.thumbs = thumbs;
    render();
  }, () => {});
  // Listings live in 16 shard documents: {items: {id: listing}}.
  db.collection("shards").limit(100).onSnapshot((snap) => {
    const all = [];
    for (const d of snap.docs) {
      const items = (d.data() || {}).items || {};
      for (const [id, item] of Object.entries(items)) if (item && item.listing_id) all.push({ ...item, _id: id, _shard: d.id });
    }
    state.byId = Object.fromEntries(all.map((x) => [x._id, x]));
    state.active = all.filter((x) => x.status !== "gone");
    state.gone = all.filter((x) => x.status === "gone");
    state.loaded = true;
    render();
  }, onErr);
})();
</script>
