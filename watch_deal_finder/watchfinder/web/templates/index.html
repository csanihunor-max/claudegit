<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Deals</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1c1b19; --muted: #6b6860; --line: #e4e1da;
    --accent: #2f5d50; --accent-soft: #e3eeea; --good: #1f7a3f; --bad: #b3261e; --hot: #c2410c;
    --chip: #efece6; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09d95; --line: #33322f;
      --accent: #7fbfae; --accent-soft: #23332e; --good: #6fcf8f; --bad: #f28b82; --hot: #fb923c;
      --chip: #2a2a27; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 14px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  select, input { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--surface); color: var(--text); width: 100%; }
  .refline { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 32px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 120px 130px auto; gap: 12px; align-items: center;
         background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
         box-shadow: var(--shadow); }
  .row.ignored, .row.gone { opacity: .6; }
  .thumb { width: 96px; height: 72px; border-radius: 8px; object-fit: cover; background: var(--chip); display: block; }
  .title { font-weight: 600; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; margin-right: 4px; }
  .chip.hot { background: var(--hot); color: #fff; }
  .chip.gone { background: var(--bad); color: #fff; }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .down { color: var(--good); } .up { color: var(--bad); }
  .margin { font-weight: 700; font-variant-numeric: tabular-nums; }
  .margin.pos { color: var(--good); } .margin.neg { color: var(--bad); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .actions button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
                    border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .actions button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  @media (max-width: 760px) {
    .row { grid-template-columns: 84px 1fr; grid-template-areas: "thumb info" "price margin" "actions actions"; }
    .row > .c-thumb { grid-area: thumb; } .row > .c-info { grid-area: info; }
    .row > .c-price { grid-area: price; } .row > .c-margin { grid-area: margin; text-align: right; }
    .row > .c-actions { grid-area: actions; }
    .thumb { width: 84px; height: 64px; }
    .actions { justify-content: stretch; } .actions button { flex: 1; padding: 10px 4px; }
  }
</style>
</head>
<body>
<header>
  <h1>Watch deals <small id="count"></small></h1>
  <div class="filters">
    <label>Search
      <select id="f-search"><option value="">All searches</option>
        {% for s in searches %}<option>{{ s }}</option>{% endfor %}
      </select></label>
    <label>Source
      <select id="f-source"><option value="">All sources</option>
        {% for s in sources %}<option value="{{ s }}">{{ source_labels.get(s, s) }}</option>{% endfor %}
      </select></label>
    <label>Max price (Ft)
      <input id="f-max" inputmode="numeric" placeholder="any"></label>
    <label>Sort
      <select id="f-sort">
        <option value="newest">Newest</option>
        <option value="cheapest">Cheapest</option>
        <option value="margin">Best margin</option>
      </select></label>
    <label>Show
      <select id="f-view">
        <option value="active">Active candidates</option>
        <option value="interested">Interested</option>
        <option value="bought">Bought</option>
        <option value="ignore">Ignored</option>
        <option value="gone">Gone</option>
      </select></label>
  </div>
  <div class="refline" id="refline"></div>
</header>
<main><div class="list" id="list"></div></main>

<script>
const $ = (id) => document.getElementById(id);
// Hungarian style: space as thousands separator, also for 4-digit numbers ("2 000 Ft").
const huf = (n) => n == null ? "–" : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft";
const eur = (n) => n == null ? "" : "~" + Math.round(n) + " €";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FILTERS = ["f-search", "f-source", "f-max", "f-sort", "f-view"];
let searchInfo = [];

function ago(iso) {
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + " min ago";
  if (mins < 48 * 60) return Math.round(mins / 60) + " h ago";
  return Math.round(mins / 1440) + " days ago";
}

function history(points) {
  if (!points || points.length < 2) return "";
  const shown = points.slice(-4);
  let out = points.length > 4 ? "… " : "";
  shown.forEach((p, i) => {
    if (i > 0) {
      const cls = p < shown[i - 1] ? "down" : "up";
      out += ` <span class="${cls}">→</span> `;
    }
    out += huf(p).replace(" Ft", "");
  });
  return out + " Ft";
}

function statusButtons(item) {
  return [["interested", "★ Interested"], ["bought", "✓ Bought"], ["ignore", "✕ Ignore"]]
    .map(([s, label]) => `<button data-status="${s}" class="${item.user_status === s ? "on" : ""}">${label}</button>`)
    .join("");
}

function render(items) {
  $("count").textContent = `· ${items.length} listing${items.length === 1 ? "" : "s"}`;
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">Nothing here yet. Run <code>python main.py once</code> or adjust the filters.</div>`;
    return;
  }
  $("list").innerHTML = items.map((it) => {
    const price = it.currency === "HUF" ? huf(it.price_huf)
      : it.price == null ? "–" : `${it.price.toFixed(2)} ${esc(it.currency)}`;
    const priceSub = it.currency === "HUF" ? eur(it.price_eur) : huf(it.price_huf);
    const margin = it.margin_eur == null ? `<span class="sub">no reference</span>`
      : `<div class="margin ${it.margin_eur >= 0 ? "pos" : "neg"}">${it.margin_eur >= 0 ? "+" : "−"}${Math.abs(Math.round(it.margin_eur))} €</div>
         <div class="sub">${it.margin_eur >= 0 ? "" : "−"}${Math.abs(it.margin_pct)}% · ref ${it.reference_eur} €</div>`;
    const chips = (it.hot ? `<span class="chip hot">🔥 ≤ {{ hot_pct }}% of ref</span>` : "")
      + (it.status === "gone" ? `<span class="chip gone">gone</span>` : "")
      + `<span class="chip">${esc(it.source_label)}</span>`
      + it.searches.map((s) => `<span class="chip">${esc(s)}</span>`).join("");
    const thumb = it.thumbnail_url
      ? `<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(it.thumbnail_url)}" alt=""
             onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'thumb'}))">`
      : `<div class="thumb"></div>`;
    return `<div class="row ${it.user_status === "ignore" ? "ignored" : ""} ${it.status === "gone" ? "gone" : ""}"
                 data-source="${esc(it.source)}" data-id="${esc(it.listing_id)}">
      <a class="c-thumb" href="${esc(it.url)}" target="_blank" rel="noopener">${thumb}</a>
      <div class="c-info">
        <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <div class="meta">${esc(it.location || "")}${it.location ? " · " : ""}first seen ${ago(it.first_seen)}</div>
        <div class="meta">${chips}</div>
      </div>
      <div class="c-price"><div class="price">${price}</div><div class="sub">${priceSub}</div>
        <div class="hist">${history(it.price_history)}</div></div>
      <div class="c-margin">${margin}</div>
      <div class="c-actions actions">${statusButtons(it)}</div>
    </div>`;
  }).join("");
}

function renderRefline() {
  const name = $("f-search").value;
  const info = searchInfo.find((s) => s.name === name);
  if (!info) { $("refline").textContent = ""; return; }
  const parts = [];
  if (info.max_price_huf) parts.push(`alert limit ${huf(info.max_price_huf)}`);
  if (info.reference_price_eur) parts.push(`resale reference ${info.reference_price_eur} €`);
  if (info.ebay_median_eur != null) parts.push(`eBay active median ${info.ebay_median_eur} € (${info.ebay_count} listings)`);
  $("refline").textContent = parts.join(" · ");
}

async function load() {
  const params = new URLSearchParams({
    search: $("f-search").value, source: $("f-source").value,
    max_price: $("f-max").value.replace(/\D/g, ""), sort: $("f-sort").value, view: $("f-view").value,
  });
  try { localStorage.setItem("wf-filters", params.toString()); } catch (e) {}
  const resp = await fetch("/api/listings?" + params);
  if (!resp.ok) { $("list").innerHTML = `<div class="empty">Error ${resp.status}</div>`; return; }
  render((await resp.json()).items);
  renderRefline();
}

$("list").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-status]");
  if (!btn) return;
  const row = btn.closest(".row");
  const status = btn.classList.contains("on") ? null : btn.dataset.status;  // click again to clear
  const resp = await fetch(`/api/listings/${encodeURIComponent(row.dataset.source)}/${encodeURIComponent(row.dataset.id)}/status`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({status}),
  });
  if (resp.ok) load();
});

try {
  const saved = new URLSearchParams(localStorage.getItem("wf-filters") || "");
  const map = {search: "f-search", source: "f-source", max_price: "f-max", sort: "f-sort", view: "f-view"};
  for (const [k, id] of Object.entries(map)) if (saved.get(k)) $(id).value = saved.get(k);
} catch (e) {}
FILTERS.forEach((id) => $(id).addEventListener(id === "f-max" ? "input" : "change", load));
fetch("/api/searches").then((r) => r.json()).then((d) => { searchInfo = d; renderRefline(); });
load();
</script>
</body>
</html>
